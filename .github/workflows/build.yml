name: CI - Upload Binaries

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build_mojave:
    name: Zip and Upload Binaries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Tag folder
        run: touch Universal-Binaries/.signed

      - name: Build DMG
        run: python3 Generate-DMG.command

      - name: Generate Checksums
        run: shasum -a 256 Universal-Binaries.dmg > sha256sum.txt

      - name: Upload Universal Binaries to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Universal Binaries
          path: Universal-Binaries.dmg

      - name: Upload Checksums to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sha256sum.txt
          path: sha256sum.txt

      - run: |
          mkdir deploy
          mv *.dmg sha256sum.txt deploy/

      - name: Get commit message
        id: commit_message
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          MESSAGE="${MESSAGE//'%'/'%25'}"
          MESSAGE="${MESSAGE//$'\n'/'%0A'}"
          MESSAGE="${MESSAGE//$'\r'/'%0D'}"
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Create or Update release
        if: github.event_name == 'push'
        uses: svenstaro/upload-release-action@v2
        with:
          file: deploy/*
          file_glob: true
          overwrite: true
          tag: 2.1.0
          release_name: 26.x test binaries, NOT for official use unless using OCCP.
          body: ${{ steps.commit_message.outputs.message }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@1beeb572c19a9242f4361f4cee78f8e0d9aec5df
        with:
          file: deploy/*
          file_glob: true
